name: Build & Verify MERSAD PREVIEW 0.1 Final Windows x64 Release

concurrency:
  group: mersad-preview-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "preview/mersad-ai-lab-0.1-*"
      - "release/mersad-preview-0.1*"
      - "fix/preview-0.1-*"
      - "fix/easyocr-windows-utf8-*"
      - "security/batch2-server-hardening-20261120"
      - "security/release-closure-aud006-20261122"

permissions:
  contents: read

jobs:
  build-and-verify-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout candidate branch (preserving main untouched)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Restore dashboard.js from compressed source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "import gzip; from pathlib import Path; p=Path('MERSAD_AI_Preview_0.1/dashboard.js.gz'); Path('MERSAD_AI_Preview_0.1/dashboard.js').write_bytes(gzip.decompress(p.read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw "dashboard.js decompression failed ($LASTEXITCODE)" }
          python -X utf8 MERSAD_AI_Preview_0.1\patch_dashboard_auth.py
          if ($LASTEXITCODE -ne 0) { throw "dashboard query-token removal failed ($LASTEXITCODE)" }
          python -X utf8 MERSAD_AI_Preview_0.1\security_closure_audit.py --report reports_and_logs\security_closure_dom_xss_report.json
          if ($LASTEXITCODE -ne 0) { throw "DOM-XSS/CSP closure audit failed ($LASTEXITCODE)" }

      - name: Install Pinned Windows x64 Dependencies & Verify Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Force UTF-8 in every Python child process, including EasyOCR's progress hook.
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8:strict"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed ($LASTEXITCODE)" }
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "pip install CPU torch==2.5.1 failed ($LASTEXITCODE)" }
          pip install -r MERSAD_AI_Preview_0.1/requirements.txt -c MERSAD_AI_Preview_0.1/constraints-win-x64.txt pyinstaller==6.11.1
          if ($LASTEXITCODE -ne 0) { throw "pip install pinned dependencies failed ($LASTEXITCODE)" }
          pip uninstall -y opencv-python-headless
          pip install --force-reinstall --no-deps opencv-python==4.11.0.86
          if ($LASTEXITCODE -ne 0) { throw "enforce GUI opencv-python failed ($LASTEXITCODE)" }
          python -X utf8 MERSAD_AI_Preview_0.1/test_prefetch_console_encoding.py
          if ($LASTEXITCODE -ne 0) { throw "Windows console encoding regression test failed ($LASTEXITCODE)" }
          python -X utf8 MERSAD_AI_Preview_0.1/check_install.py --verify-pip-deps
          if ($LASTEXITCODE -ne 0) { throw "check_install.py --verify-pip-deps failed ($LASTEXITCODE)" }

          # Verify or install Inno Setup 6 (ISCC.exe) explicitly on GitHub Actions runner
          $isccCheck = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if ($null -eq $isccCheck -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Test-Path "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")) {
            Write-Host "[Setup] Installing Inno Setup 6 via Chocolatey..."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          }
          $tessCheck = Get-Command "tesseract.exe" -ErrorAction SilentlyContinue
          if ($null -eq $tessCheck -and -not (Test-Path "${env:ProgramFiles}\Tesseract-OCR\tesseract.exe")) {
            Write-Host "[Setup] Installing Tesseract OCR via Chocolatey for auxiliary benchmark..."
            choco install tesseract -y --no-progress
          }
          # Regenerate only the repository's safe synthetic fixtures. The generator
          # refuses to overwrite operator-imported consented faces or natural vehicle data.
          python tools/prepare_safe_eval_benchmarks.py --generate
          if ($LASTEXITCODE -ne 0) { throw "prepare_safe_eval_benchmarks.py --generate failed ($LASTEXITCODE)" }
          python tools/prepare_safe_eval_benchmarks.py --verify
          if ($LASTEXITCODE -ne 0) { throw "prepare_safe_eval_benchmarks.py --verify failed ($LASTEXITCODE)" }

      - name: Phase 1 — Download All 4 Real AI Models, Verify Pinned SHA-256 & Execute Real Inference on LAB Frames
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8:strict"
          python -X utf8 MERSAD_AI_Preview_0.1/prefetch.py
          if ($LASTEXITCODE -ne 0) { throw "prefetch.py failed ($LASTEXITCODE)" }
          python -X utf8 MERSAD_AI_Preview_0.1/mersad_live.py --verify-models
          if ($LASTEXITCODE -ne 0) { throw "--verify-models failed ($LASTEXITCODE)" }
          python -X utf8 -u integration/evaluate_ai_models.py --require-real-models
          if ($LASTEXITCODE -ne 0) { throw "evaluate_ai_models.py --require-real-models failed ($LASTEXITCODE)" }

      - name: Phase 2 — Restore Original LAB archive, verify exact commit & compare with Clean-Room LAB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin build/mersad-lab-exe-20261031:refs/remotes/origin/mersad-lab-orig
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the historical Original LAB branch" }

          $actualSha = (git rev-parse refs/remotes/origin/mersad-lab-orig).Trim().ToLower()
          $expectedSha = "ed7b8f727243da4878e547f08489af581c83291c"
          if ($actualSha -ne $expectedSha) {
            throw "Original LAB ref mismatch: expected $expectedSha, got $actualSha"
          }

          # The historical commit stores the LAB source as nine base64 chunks.
          # Reassemble and extract the real source archive before comparison.
          $parts = @()
          for ($i = 1; $i -le 9; $i++) {
            $partPath = "ci/mersad_lab_source_part_{0:D2}.txt" -f $i
            $gitPath = "refs/remotes/origin/mersad-lab-orig:$partPath"
            $chunkLines = @(git show $gitPath)
            if ($LASTEXITCODE -ne 0 -or $chunkLines.Count -eq 0) {
              throw "Could not read Original LAB source chunk from historical commit: $gitPath"
            }
            $parts += (($chunkLines -join "")).Trim()
          }
          $base64 = $parts -join ""
          if (($base64.Length % 4) -ne 0) {
            throw "Invalid Original LAB archive base64 length: $($base64.Length)"
          }
          $zipBytes = [Convert]::FromBase64String($base64)
          $zipPath = Join-Path $env:RUNNER_TEMP "mersad-lab-original-$actualSha.zip"
          [IO.File]::WriteAllBytes($zipPath, $zipBytes)
          $archiveSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLower()
          Write-Host "[ORIGINAL LAB] Reassembled archive SHA-256: $archiveSha256"

          $extractRoot = Join-Path $env:RUNNER_TEMP "mersad-lab-original-extracted"
          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force

          $restoredSource = Join-Path $extractRoot "MERSAD_LAB"
          foreach ($required in @("lab_server.py", "test_lab.py", "index.html")) {
            if (-not (Test-Path -LiteralPath (Join-Path $restoredSource $required) -PathType Leaf)) {
              throw "Restored Original LAB archive is incomplete: missing $required"
            }
          }

          $originalDir = "MERSAD_LAB_Original_ed7b8f72"
          if (Test-Path -LiteralPath $originalDir) {
            Remove-Item -LiteralPath $originalDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $originalDir | Out-Null
          Get-ChildItem -LiteralPath $restoredSource -Force | Copy-Item -Destination $originalDir -Recurse -Force
          Set-Content -LiteralPath (Join-Path $originalDir "COMMIT_SHA.txt") -Value $actualSha -Encoding ASCII

          $pythonFileCount = @(Get-ChildItem -LiteralPath $originalDir -Filter "*.py" -Recurse -File).Count
          if ($pythonFileCount -lt 2) {
            throw "Original LAB source restoration incomplete: expected Python sources, found $pythonFileCount"
          }
          Write-Host "[ORIGINAL LAB] Exact commit verified: $actualSha"
          Write-Host "[ORIGINAL LAB] Restored Python source files: $pythonFileCount"

          python tools/compare_original_vs_cleanroom_lab.py --original-source $originalDir --preserve-original-dir $originalDir --cleanroom-dir "MERSAD_LAB_Preview_0.1" --require-cleanroom-pass --require-unblocked
          if ($LASTEXITCODE -ne 0) { throw "Clean-Room LAB verification failed in Phase 2 ($LASTEXITCODE)" }

          $reportPath = "reports_and_logs/original_vs_cleanroom_lab_comparison.json"
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Phase 2 comparison JSON report was not generated"
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.commit_verification.verified -ne $true) {
            throw "Phase 2 did not verify the exact historical Original LAB commit"
          }
          if ($report.independent_test_suites.cleanroom_lab.status -ne "PASS") {
            throw "Clean-Room LAB suite did not pass"
          }
          Write-Host "[PHASE2] Original commit verified: $($report.commit_verification.detected_commit)"
          Write-Host "[PHASE2] Original LAB suite: $($report.independent_test_suites.original_lab.status) ($($report.independent_test_suites.original_lab.passed)/$($report.independent_test_suites.original_lab.total))"
          Write-Host "[PHASE2] Clean-Room LAB suite: $($report.independent_test_suites.cleanroom_lab.status) ($($report.independent_test_suites.cleanroom_lab.passed)/$($report.independent_test_suites.cleanroom_lab.total))"
          Write-Host "[PHASE2] Overall comparison status: $($report.phase2_comparison_status)"

      - name: Phase 3A — Run Full AI (234) & LAB (22) Test Suites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8:strict"
          python -X utf8 -u MERSAD_AI_Preview_0.1/selftest.py
          if ($LASTEXITCODE -ne 0) { throw "selftest.py (standard) failed ($LASTEXITCODE)" }
          $env:MERSAD_BLOCK_SKLEARN="1"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8:strict"
          python -X utf8 -u MERSAD_AI_Preview_0.1/selftest.py
          if ($LASTEXITCODE -ne 0) { throw "selftest.py (MERSAD_BLOCK_SKLEARN=1) failed ($LASTEXITCODE)" }
          Remove-Item Env:\MERSAD_BLOCK_SKLEARN -ErrorAction SilentlyContinue
          python -X utf8 -u MERSAD_AI_Preview_0.1/verify_integrity.py --check-models
          if ($LASTEXITCODE -ne 0) { throw "verify_integrity.py --check-models failed ($LASTEXITCODE)" }
          python -X utf8 -u MERSAD_LAB_Preview_0.1/test_lab.py
          if ($LASTEXITCODE -ne 0) { throw "test_lab.py failed ($LASTEXITCODE)" }

      - name: Phase 3B — Purge Old Outputs & Build MERSAD_AI.exe, MERSAD_LAB.exe, Portable ZIPs & MERSAD_LAB_Setup_x64.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($d in @("MERSAD_AI_Preview_0.1\build","MERSAD_AI_Preview_0.1\dist","MERSAD_LAB_Preview_0.1\build","MERSAD_LAB_Preview_0.1\dist")) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }
          $isccCmd = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if ($null -ne $isccCmd) {
            $isccPath = $isccCmd.Source
          } elseif (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
            $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "${env:ProgramFiles}\Inno Setup 6\ISCC.exe") {
            $isccPath = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          } else {
            throw "FATAL: ISCC.exe (Inno Setup 6) is missing; MERSAD_LAB_Setup_x64.exe is mandatory"
          }

          Push-Location MERSAD_AI_Preview_0.1
          pyinstaller --noconfirm --clean mersad_ai.spec
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller mersad_ai.spec failed ($LASTEXITCODE)" }
          Copy-Item -Path "models" -Destination "dist\MERSAD_AI\models" -Recurse -Force
          Copy-Item -Path "dashboard.html","dashboard.js","camera-ui.js","purify.min.js","dompurify-guard.js","LICENSE_DOMPURIFY.txt","README_AR.md","SYSTEM_REQUIREMENTS.txt","verify_integrity.py" -Destination "dist\MERSAD_AI\" -Force
          foreach ($asset in @("camera-ui.js","purify.min.js","dompurify-guard.js","LICENSE_DOMPURIFY.txt")) {
            if (-not (Test-Path -LiteralPath "dist\MERSAD_AI\$asset" -PathType Leaf)) { throw "AI distribution is missing $asset" }
          }
          # PR5 frozen dashboard.js smoke test

          if (!(Test-Path "dist\MERSAD_AI\dashboard.js")) { throw "dashboard.js missing from frozen MERSAD_AI distribution" }
          python -X utf8 -u windows_frozen_dashboard_smoke.py "dist\MERSAD_AI\MERSAD_AI.exe"
          if ($LASTEXITCODE -ne 0) { throw "Frozen dashboard.js HTTP smoke test failed ($LASTEXITCODE)" }
          $edgeCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"),
            (Join-Path $env:ProgramFiles "Microsoft\Edge\Application\msedge.exe")
          )
          $edge = $edgeCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $edge) { throw "Microsoft Edge is required for the DOMPurify runtime smoke test" }
          $smokeFile = (Resolve-Path "dom_guard_smoke.html").Path.Replace("\","/")
          $smokeUri = "file:///$smokeFile"
          $dom = & $edge --headless=new --disable-gpu --no-first-run --no-default-browser-check --allow-file-access-from-files --dump-dom $smokeUri 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $dom -notmatch 'data-dom-guard="PASS"') {
            throw "DOMPurify browser smoke test failed. Output: $dom"
          }
          Write-Host "[DOM-XSS] Edge headless smoke test passed."
          Set-Content -LiteralPath "dist\MERSAD_AI\RUN.bat" -Encoding utf8 -Value "@echo off`r`nchcp 65001 >nul`r`ncd /d `"%~dp0`"`r`nMERSAD_AI.exe %*`r`npause"
          Set-Content -LiteralPath "dist\MERSAD_AI\RUN_LAN.bat" -Encoding utf8 -Value "@echo off`r`nchcp 65001 >nul`r`ncd /d `"%~dp0`"`r`necho [LAN MODE] Starting MERSAD_AI.exe on 0.0.0.0 for local Wi-Fi access...`r`nMERSAD_AI.exe --host 0.0.0.0 %*`r`npause"
          Set-Content -LiteralPath "dist\MERSAD_AI\VERIFY_AUDIT.bat" -Encoding utf8 -Value "@echo off`r`nchcp 65001 >nul`r`ncd /d `"%~dp0`"`r`nMERSAD_AI.exe --verify || (pause & exit /b 1)`r`nMERSAD_AI.exe --verify-models || (pause & exit /b 1)`r`nMERSAD_AI.exe --readiness-report || (pause & exit /b 1)`r`npause"
          New-Item -ItemType Directory -Force -Path "dist\portable" | Out-Null
          Compress-Archive -Path "dist\MERSAD_AI\*" -DestinationPath "dist\portable\MERSAD_AI_Portable_x64.zip" -Force
          Pop-Location

          Push-Location MERSAD_LAB_Preview_0.1
          pyinstaller --noconfirm --clean mersad_lab.spec
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller mersad_lab.spec failed ($LASTEXITCODE)" }
          Copy-Item -Path "index.html","lab.js","README_AR.md","PHASE1_STATUS_AR.md","RUN_LAB.bat" -Destination "dist\MERSAD_LAB\" -Force
          if (-not (Test-Path -LiteralPath "dist\MERSAD_LAB\lab.js" -PathType Leaf)) { throw "Published LAB distribution is missing lab.js" }
          New-Item -ItemType Directory -Force -Path "dist\portable" | Out-Null
          Compress-Archive -Path "dist\MERSAD_LAB\*" -DestinationPath "dist\portable\MERSAD_LAB_Portable_x64.zip" -Force
          & $isccPath "installer\mersad_lab_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed ($LASTEXITCODE)" }
          Pop-Location

          foreach ($reqFile in @(
            "MERSAD_AI_Preview_0.1\dist\MERSAD_AI\MERSAD_AI.exe",
            "MERSAD_LAB_Preview_0.1\dist\MERSAD_LAB\MERSAD_LAB.exe",
            "MERSAD_LAB_Preview_0.1\dist\installer\MERSAD_LAB_Setup_x64.exe",
            "MERSAD_AI_Preview_0.1\dist\portable\MERSAD_AI_Portable_x64.zip",
            "MERSAD_LAB_Preview_0.1\dist\portable\MERSAD_LAB_Portable_x64.zip"
          )) {
            if (-not (Test-Path -LiteralPath $reqFile -PathType Leaf)) {
              throw "FATAL: Mandatory build output missing: $reqFile"
            }
          }

      - name: Phase 3C — Test EXEs & Installer (Install -> Run -> Uninstall) in Arabic Path with Spaces & Scrubbed PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arabicRoot = Join-Path $env:RUNNER_TEMP "مسار اختبار مرصاد الذكي Preview 0.1"
          New-Item -ItemType Directory -Force -Path "$arabicRoot\MERSAD_AI" | Out-Null
          New-Item -ItemType Directory -Force -Path "$arabicRoot\MERSAD_LAB" | Out-Null
          Copy-Item -Path "MERSAD_AI_Preview_0.1\dist\MERSAD_AI\*" -Destination "$arabicRoot\MERSAD_AI\" -Recurse -Force
          Copy-Item -Path "MERSAD_LAB_Preview_0.1\dist\MERSAD_LAB\*" -Destination "$arabicRoot\MERSAD_LAB\" -Recurse -Force

          $arabicInstallDir = Join-Path $env:RUNNER_TEMP "تثبيت مختبر مرصاد Preview 0.1"
          $setupExe = (Resolve-Path "MERSAD_LAB_Preview_0.1\dist\installer\MERSAD_LAB_Setup_x64.exe").Path

          # Scrub Python from PATH so EXEs prove zero dependency on external Python environment
          $origPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            & "$arabicRoot\MERSAD_AI\MERSAD_AI.exe" --verify-runtime-deps
            if ($LASTEXITCODE -ne 0) { throw "MERSAD_AI.exe --verify-runtime-deps failed in Arabic path ($LASTEXITCODE)" }
            & "$arabicRoot\MERSAD_AI\MERSAD_AI.exe" --verify-models
            if ($LASTEXITCODE -ne 0) { throw "MERSAD_AI.exe --verify-models failed in Arabic path ($LASTEXITCODE)" }
            & "$arabicRoot\MERSAD_AI\MERSAD_AI.exe" --verify
            if ($LASTEXITCODE -ne 0) { throw "MERSAD_AI.exe --verify failed in Arabic path ($LASTEXITCODE)" }
            & "$arabicRoot\MERSAD_LAB\MERSAD_LAB.exe" --port 0 --self-check
            if ($LASTEXITCODE -ne 0) { throw "MERSAD_LAB.exe --self-check failed in Arabic path ($LASTEXITCODE)" }

            $pInst = Start-Process -FilePath $setupExe -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$arabicInstallDir`"") -Wait -PassThru
            if ($pInst.ExitCode -ne 0) { throw "MERSAD_LAB_Setup_x64.exe install failed ($($pInst.ExitCode))" }
            if (-not (Test-Path -LiteralPath "$arabicInstallDir\MERSAD_LAB.exe")) { throw "Installed MERSAD_LAB.exe missing" }
            if (-not (Test-Path -LiteralPath "$arabicInstallDir\index.html")) { throw "Installed LAB index.html missing" }
            if (-not (Test-Path -LiteralPath "$arabicInstallDir\lab.js")) { throw "Installed LAB lab.js missing" }

            & "$arabicInstallDir\MERSAD_LAB.exe" --port 0 --self-check
            if ($LASTEXITCODE -ne 0) { throw "Installed MERSAD_LAB.exe --self-check failed ($LASTEXITCODE)" }

            $pUninst = Start-Process -FilePath "$arabicInstallDir\unins000.exe" -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait -PassThru
            if ($pUninst.ExitCode -ne 0) { throw "unins000.exe uninstall failed ($($pUninst.ExitCode))" }
            Start-Sleep -Seconds 2
            if (Test-Path -LiteralPath "$arabicInstallDir\MERSAD_LAB.exe") { throw "MERSAD_LAB.exe still exists after uninstall" }
          } finally {
            $env:PATH = $origPath
          }

      - name: Phase 4 — Final Real End-to-End Integration (LAB -> MJPEG -> OpenCV -> YOLOv8n -> Plate -> EasyOCR -> Registry -> Alert -> SQLite -> Audit)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8:strict"
          python -X utf8 -u integration/test_main_entrypoint_dynamic_camera_lifecycle.py
          if ($LASTEXITCODE -ne 0) { throw "test_main_entrypoint_dynamic_camera_lifecycle.py failed ($LASTEXITCODE)" }
          python -X utf8 -u integration/test_ai_lab_integration.py --require-real-models
          if ($LASTEXITCODE -ne 0) { throw "test_ai_lab_integration.py --require-real-models failed ($LASTEXITCODE)" }

      - name: Phase 5 — Assemble MERSAD_PREVIEW_0.1_FINAL & Generate SHA-256 Sums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $finalOut = "MERSAD_PREVIEW_0.1_FINAL_DIST"
          New-Item -ItemType Directory -Force -Path "$finalOut\MERSAD_AI" | Out-Null
          New-Item -ItemType Directory -Force -Path "$finalOut\MERSAD_LAB" | Out-Null
          New-Item -ItemType Directory -Force -Path "$finalOut\Installers_and_Portable" | Out-Null
          Copy-Item -Path "MERSAD_AI_Preview_0.1\dist\MERSAD_AI\*" -Destination "$finalOut\MERSAD_AI\" -Recurse -Force
          Copy-Item -Path "MERSAD_LAB_Preview_0.1\dist\MERSAD_LAB\*" -Destination "$finalOut\MERSAD_LAB\" -Recurse -Force
          Copy-Item -Path "MERSAD_AI_Preview_0.1\dist\portable\MERSAD_AI_Portable_x64.zip" -Destination "$finalOut\Installers_and_Portable\MERSAD_AI_Portable_x64.zip" -Force
          Copy-Item -Path "MERSAD_LAB_Preview_0.1\dist\portable\MERSAD_LAB_Portable_x64.zip" -Destination "$finalOut\Installers_and_Portable\MERSAD_LAB_Portable_x64.zip" -Force
          Copy-Item -Path "MERSAD_LAB_Preview_0.1\dist\installer\MERSAD_LAB_Setup_x64.exe" -Destination "$finalOut\Installers_and_Portable\MERSAD_LAB_Setup_x64.exe" -Force

          $manifestPath = Join-Path $finalOut "SHA256SUMS_WINDOWS_FINAL.txt"
          $finalRoot = (Resolve-Path -LiteralPath $finalOut).Path
          $manifestRows = [Collections.Generic.List[string]]::new()
          $manifestPaths = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $filesToHash = @(Get-ChildItem -LiteralPath $finalOut -Recurse -Force -File | Where-Object {
            -not [string]::Equals($_.FullName, $manifestPath, [StringComparison]::OrdinalIgnoreCase)
          })
          foreach ($file in $filesToHash) {
            $relative = [IO.Path]::GetRelativePath($finalRoot, $file.FullName).Replace('\', '/')
            if (-not $manifestPaths.Add($relative)) {
              throw "Duplicate path while generating SHA-256 manifest: $relative"
            }
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [void]$manifestRows.Add("$hash  $relative")
          }

          $requiredManifestPaths = @(
            "MERSAD_AI/MERSAD_AI.exe",
            "MERSAD_LAB/MERSAD_LAB.exe",
            "Installers_and_Portable/MERSAD_AI_Portable_x64.zip",
            "Installers_and_Portable/MERSAD_LAB_Portable_x64.zip",
            "Installers_and_Portable/MERSAD_LAB_Setup_x64.exe"
          )
          foreach ($requiredPath in $requiredManifestPaths) {
            if (-not $manifestPaths.Contains($requiredPath)) {
              throw "SHA-256 manifest generation omitted a required release file: $requiredPath"
            }
          }
          if ($manifestRows.Count -lt 100) {
            throw "SHA-256 manifest generation produced too few entries: $($manifestRows.Count)"
          }
          $manifestRows | Set-Content -LiteralPath $manifestPath -Encoding UTF8

      - name: Upload MERSAD_PREVIEW_0.1_FINAL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MERSAD_PREVIEW_0.1_FINAL_Windows_x64
          path: MERSAD_PREVIEW_0.1_FINAL_DIST/
          # Preserve hidden trust metadata and bundled sklearn runtime DLLs that are covered by SHA256SUMS.
          include-hidden-files: true

  post-upload-acceptance:
    name: Post-upload artifact acceptance
    needs: build-and-verify-windows-x64
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout candidate for acceptance script
        uses: actions/checkout@v7.0.1

      - name: Download completed build artifact
        uses: actions/download-artifact@v4
        with:
          name: MERSAD_PREVIEW_0.1_FINAL_Windows_x64
          path: ${{ runner.temp }}/mersad-published-artifact

      - name: Verify published hashes, hidden files, Portable packages & installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./ci/verify_published_artifact.ps1 -ArtifactRoot (Join-Path $env:RUNNER_TEMP "mersad-published-artifact")
