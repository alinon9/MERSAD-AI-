name: MERSAD AI Windows x64 Build & Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test-windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Create clean virtual environment and install pinned dependencies
        run: |
          python -m venv venv
          if errorlevel 1 exit /b 1
          venv\Scripts\python.exe -m pip install --upgrade pip
          if errorlevel 1 exit /b 1
          venv\Scripts\pip.exe install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          if errorlevel 1 exit /b 1
          venv\Scripts\pip.exe install -r requirements.txt -c constraints-win-x64.txt
          if errorlevel 1 exit /b 1
          venv\Scripts\pip.exe uninstall -y opencv-python-headless
          if errorlevel 1 exit /b 1
          venv\Scripts\pip.exe install --force-reinstall --no-deps opencv-python==4.11.0.86
          if errorlevel 1 exit /b 1
          venv\Scripts\pip.exe install pyinstaller==6.11.1 -c constraints-win-x64.txt
          if errorlevel 1 exit /b 1

      - name: Check dependency conflicts (pip check)
        run: |
          venv\Scripts\python.exe -m pip check
          if errorlevel 1 exit /b 1
          venv\Scripts\pip.exe list > pip_installed_versions.txt
          if errorlevel 1 exit /b 1

      - name: Compile modules and repeat concurrency/camera tests on Windows
        run: |
          venv\Scripts\python.exe -m compileall -q .
          if errorlevel 1 exit /b 1
          for /L %%I in (1,1,3) do (
            venv\Scripts\python.exe -u selftest.py > selftest_standard_%%I.log 2>&1
            if errorlevel 1 (type selftest_standard_%%I.log & exit /b 1)
            findstr /C:"SELF-TEST OK" selftest_standard_%%I.log >nul
            if errorlevel 1 (type selftest_standard_%%I.log & exit /b 1)
          )
          set MERSAD_BLOCK_SKLEARN=1
          for /L %%I in (1,1,2) do (
            venv\Scripts\python.exe -u selftest.py > selftest_nosklearn_%%I.log 2>&1
            if errorlevel 1 (type selftest_nosklearn_%%I.log & exit /b 1)
            findstr /C:"SELF-TEST OK" selftest_nosklearn_%%I.log >nul
            if errorlevel 1 (type selftest_nosklearn_%%I.log & exit /b 1)
          )
          set MERSAD_BLOCK_SKLEARN=

      - name: Download and verify all AI models (OpenCV Zoo SHA-256 + YOLOv8n + EasyOCR)
        run: |
          venv\Scripts\python.exe prefetch.py
          if errorlevel 1 exit /b 1
          venv\Scripts\python.exe check_install.py --write-ready
          if errorlevel 1 exit /b 1
          venv\Scripts\python.exe check_install.py --strict > check_install_report.log 2>&1
          if errorlevel 1 (type check_install_report.log & exit /b 1)
          type check_install_report.log

      - name: Build Windows --onedir distribution via PyInstaller
        run: |
          venv\Scripts\pyinstaller.exe --noconfirm --clean mersad_ai.spec > build_pyinstaller.log 2>&1
          if errorlevel 1 (type build_pyinstaller.log & exit /b 1)
          xcopy /E /I /Y "models" "dist\MERSAD_AI\models"
          if errorlevel 1 exit /b 1
          if not exist "dist\MERSAD_AI\MERSAD_AI.exe" exit /b 1
          "dist\MERSAD_AI\MERSAD_AI.exe" --verify > exe_verify_build.log 2>&1
          if errorlevel 1 (type exe_verify_build.log & exit /b 1)
          findstr /C:"Audit chain OK" exe_verify_build.log
          if errorlevel 1 exit /b 1
          "dist\MERSAD_AI\MERSAD_AI.exe" --verify-models > exe_model_verify.log 2>&1
          if errorlevel 1 (type exe_model_verify.log & exit /b 1)
          findstr /C:"All bundled AI models are present and valid." exe_model_verify.log
          if errorlevel 1 (type exe_model_verify.log & exit /b 1)

      - name: Test standalone distribution from paths with spaces and Arabic characters (without venv)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'C:\اختبار مرصاد AI\نسخة التوزيع\MERSAD_AI'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path 'dist\MERSAD_AI\*' -Destination $destination -Recurse -Force
          Set-Location $env:TEMP
          & (Join-Path $destination 'MERSAD_AI.exe') --verify *> exe_verify_output.txt
          if ($LASTEXITCODE -ne 0) { Get-Content exe_verify_output.txt; throw 'Relocated EXE audit verification failed.' }
          Get-Content exe_verify_output.txt
          if (-not (Select-String -Path exe_verify_output.txt -SimpleMatch 'Audit chain OK' -Quiet)) { throw 'Audit chain verification marker was not found.' }
          & (Join-Path $destination 'MERSAD_AI.exe') --verify-models *> exe_model_verify_relocated.log
          if ($LASTEXITCODE -ne 0) { Get-Content exe_model_verify_relocated.log; throw 'Relocated EXE model verification failed.' }
          Get-Content exe_model_verify_relocated.log
          if (-not (Select-String -Path exe_model_verify_relocated.log -SimpleMatch 'All bundled AI models are present and valid.' -Quiet)) { throw 'Model verification marker was not found after relocation.' }

      - name: Upload build logs and distribution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MERSAD_AI_Windows_x64_Distribution_and_Logs
          path: |
            pip_installed_versions.txt
            selftest_standard_*.log
            selftest_nosklearn_*.log
            check_install_report.log
            build_pyinstaller.log
            exe_verify_build.log
            exe_model_verify.log
            exe_verify_output.txt
            exe_model_verify_relocated.log
            dist/MERSAD_AI/
