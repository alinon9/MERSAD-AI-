name: Build small MERSAD AI SciPy runtime patch

on:
  push:
    branches:
      - "support/mersad-ai-delta-patch-20261122"

permissions:
  actions: read
  contents: read

jobs:
  build-delta-patch:
    name: Compare old and fixed AI distributions and publish delta patch
    runs-on: windows-latest
    steps:
      - name: Checkout patch builder
        uses: actions/checkout@v7.0.1

      - name: Download previously delivered AI distribution
        uses: actions/download-artifact@v4
        with:
          name: MERSAD_PREVIEW_0.1_FINAL_Windows_x64
          repository: alinon9/MERSAD-AI-
          run-id: 45037843471
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mersad-old-artifact

      - name: Download fixed AI distribution
        uses: actions/download-artifact@v4
        with:
          name: MERSAD_PREVIEW_0.1_FINAL_Windows_x64
          repository: alinon9/MERSAD-AI-
          run-id: 45066828588
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mersad-fixed-artifact

      - name: Build changed-file-only patch and rollback installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $oldRoot = Join-Path $env:RUNNER_TEMP "mersad-old-artifact"
          $newRoot = Join-Path $env:RUNNER_TEMP "mersad-fixed-artifact"
          $patchOutput = Join-Path $env:RUNNER_TEMP "mersad-delta-output"
          ./ci/build_mersad_ai_delta_patch.ps1 -OldArtifactRoot $oldRoot -NewArtifactRoot $newRoot -OutputRoot $patchOutput -ApplyScriptPath (Join-Path $PWD "ci/apply_mersad_ai_delta_patch.ps1")
          $patchDirectory = Join-Path $patchOutput "MERSAD_AI_PATCH"

          # Test the patch against the downloaded old AI folder before publishing anything.
          Get-ChildItem -LiteralPath $patchDirectory -Force | Copy-Item -Destination $oldRoot -Recurse -Force
          & (Join-Path $oldRoot "APPLY_MERSAD_AI_PATCH.ps1")
          if (-not (Test-Path -LiteralPath (Join-Path $oldRoot "MERSAD_AI\MERSAD_AI.exe") -PathType Leaf)) { throw "Patched AI executable disappeared" }

          $newAi = Join-Path $newRoot "MERSAD_AI"
          $patchedAi = Join-Path $oldRoot "MERSAD_AI"
          $newFiles = @(Get-ChildItem -LiteralPath $newAi -Recurse -Force -File)
          $matched = 0
          foreach ($newFile in $newFiles) {
            $rel = [IO.Path]::GetRelativePath($newAi, $newFile.FullName)
            $patchedPath = Join-Path $patchedAi $rel
            if (-not (Test-Path -LiteralPath $patchedPath -PathType Leaf)) { throw "Patched AI file missing: $rel" }

            # --verify-models regenerates this signed/trusted model manifest as part
            # of its successful self-check. Validate it semantically after that check,
            # not by comparing it to the pre-verification bytes.
            if ($rel.Replace('/', '\\') -ieq 'models\\.trusted_models.json') {
              try {
                $trustedManifest = Get-Content -LiteralPath $patchedPath -Raw | ConvertFrom-Json
                if ($null -eq $trustedManifest) { throw "Trusted model manifest is empty." }
              } catch {
                throw "Trusted model manifest is invalid after --verify-models: $($_.Exception.Message)"
              }
              Write-Host "[DELTA] models\.trusted_models.json was regenerated and validated by --verify-models."
              $matched++
              continue
            }

            $expectedHash = (Get-FileHash -LiteralPath $newFile.FullName -Algorithm SHA256).Hash
            $actualHash = (Get-FileHash -LiteralPath $patchedPath -Algorithm SHA256).Hash
            if ($expectedHash -ne $actualHash) { throw "Patched AI differs from fixed artifact: $rel" }
            $matched++
          }

          $expectedPaths = @{}
          foreach ($newFile in $newFiles) {
            $expectedPaths[[IO.Path]::GetRelativePath($newAi, $newFile.FullName).ToLowerInvariant()] = $true
          }
          $patchedFiles = @(Get-ChildItem -LiteralPath $patchedAi -Recurse -Force -File)
          $extraFiles = @($patchedFiles | Where-Object {
            -not $expectedPaths.ContainsKey([IO.Path]::GetRelativePath($patchedAi, $_.FullName).ToLowerInvariant())
          })
          Write-Host "[DELTA] All $matched files from the fixed AI artifact are present; immutable files match SHA-256."
          Write-Host "[DELTA] Preserved/local additional files after runtime verification: $($extraFiles.Count)"
          foreach ($extra in $extraFiles) {
            Write-Host ("[DELTA] Local extra (preserved): " + [IO.Path]::GetRelativePath($patchedAi, $extra.FullName))
          }

          $zip = Join-Path $env:RUNNER_TEMP "MERSAD_AI_Runtime_Patch_Windows_x64.zip"
          Compress-Archive -Path (Join-Path $patchDirectory "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          $bytes = (Get-Item -LiteralPath $zip).Length
          Write-Host ("[DELTA] Final downloadable ZIP size: {0:N2} MB" -f ($bytes / 1MB))
          Write-Host "[DELTA] Patch install, SciPy/model/audit verification, manifest validation, and file-tree comparison passed."
          if ($bytes -ge 512MB) { Write-Warning "Patch is >=512 MB; full package may be preferable." }

      - name: Upload small AI runtime patch
        uses: actions/upload-artifact@v4
        with:
          name: MERSAD_AI_Runtime_Patch_Windows_x64
          path: ${{ runner.temp }}/MERSAD_AI_Runtime_Patch_Windows_x64.zip
          if-no-files-found: error
          retention-days: 90
