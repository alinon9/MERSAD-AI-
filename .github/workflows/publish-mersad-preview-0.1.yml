name: Import verified MERSAD PREVIEW 0.1 source bundle
on:
  push:
    branches:
      - staging/mersad-preview-0.1-upload
    paths:
      - release_bundle/parts/**

permissions:
  contents: write
  actions: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reassemble and verify candidate Git bundle
        shell: bash
        env:
          EXPECTED_BUNDLE_COMMIT: 289523d3c1192fd0d3811998996613d564c91a22
        run: |
          set -euo pipefail
          mkdir -p release_bundle
          cat release_bundle/parts/part*.b64 > "$RUNNER_TEMP/mersad-preview.bundle.b64"
          base64 --decode "$RUNNER_TEMP/mersad-preview.bundle.b64" > release_bundle/mersad-preview-0.1.bundle
          VERIFY_DIR="$RUNNER_TEMP/mersad-bundle-verify"
          SOURCE_DIR="$RUNNER_TEMP/mersad-preview-source"
          mkdir -p "$VERIFY_DIR"
          git -C "$VERIFY_DIR" init -q
          git -C "$VERIFY_DIR" bundle verify "$GITHUB_WORKSPACE/release_bundle/mersad-preview-0.1.bundle"
          git clone --quiet "$GITHUB_WORKSPACE/release_bundle/mersad-preview-0.1.bundle" "$SOURCE_DIR"
          ACTUAL="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          if [[ "$ACTUAL" != "$EXPECTED_BUNDLE_COMMIT" ]]; then
            echo "::error::Candidate bundle commit mismatch: expected $EXPECTED_BUNDLE_COMMIT, got $ACTUAL"
            exit 1
          fi
          TREE="$(git -C "$SOURCE_DIR" rev-parse 'HEAD^{tree}')"
          echo "Verified candidate commit $ACTUAL"
          echo "Verified candidate tree $TREE"

      - name: Publish candidate branch without force push
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: preview/mersad-ai-lab-0.1-20261105
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/mersad-preview-source"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$SOURCE_DIR" config user.name "MERSAD Preview Release Bot"
          git -C "$SOURCE_DIR" config user.email "mersad-preview-release-bot@users.noreply.github.com"
          git -C "$SOURCE_DIR" remote add publish "$REMOTE"
          git -C "$SOURCE_DIR" fetch --no-tags publish main
          MAIN_SHA="$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD)"
          TREE="$(git -C "$SOURCE_DIR" rev-parse 'HEAD^{tree}')"
          TARGET_REF="refs/heads/$TARGET_BRANCH"
          EXISTING_SHA="$(git ls-remote --heads "$REMOTE" "$TARGET_REF" | awk '{print $1}')"
          if [[ -n "$EXISTING_SHA" ]]; then
            git -C "$SOURCE_DIR" fetch --no-tags publish "$TARGET_REF"
            EXISTING_TREE="$(git -C "$SOURCE_DIR" rev-parse 'FETCH_HEAD^{tree}')"
            if [[ "$EXISTING_TREE" != "$TREE" ]]; then
              echo "::error::Target branch exists with a different tree. Refusing to overwrite it."
              exit 1
            fi
            NEW_COMMIT="$EXISTING_SHA"
          else
            NEW_COMMIT="$(printf '%s\n' 'Publish MERSAD PREVIEW 0.1 candidate source' | git -C "$SOURCE_DIR" commit-tree "$TREE" -p "$MAIN_SHA")"
            git -C "$SOURCE_DIR" push publish "$NEW_COMMIT:$TARGET_REF"
          fi
          echo "Published candidate commit: $NEW_COMMIT"
          echo "candidate_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Dispatch verified Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: preview/mersad-ai-lab-0.1-20261105
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-mersad-preview-dispatch.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"candidate_branch\":\"$TARGET_BRANCH\"}}"
