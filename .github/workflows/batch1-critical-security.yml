name: MERSAD Batch 1 Critical Security Regression

on:
  push:
    branches:
      - fix/mersad-preview-0.2-release-hardening
  workflow_dispatch:

concurrency:
  group: mersad-batch1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-security-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install minimal production-test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed ($LASTEXITCODE)" }
          python -m pip install numpy==1.26.4 opencv-python==4.11.0.86 Pillow==10.4.0 openpyxl==3.1.5 scikit-learn==1.5.2
          if ($LASTEXITCODE -ne 0) { throw "test dependencies installation failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path artifacts\batch1-logs | Out-Null

      - name: Batch 1 LAB SSRF, DNS pinning, TLS and auth regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          python -X utf8 -u MERSAD_LAB_Preview_0.1\test_batch1_security.py -v 2>&1 | Tee-Object artifacts\batch1-logs\test_batch1_security.py.log
          if ($LASTEXITCODE -ne 0) { throw "Batch 1 LAB security tests failed ($LASTEXITCODE)" }

      - name: Batch 2 LAB LAN, IPv6 and Cookie hardening
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          python -X utf8 -u MERSAD_LAB_Preview_0.1\\test_batch2_security.py -v 2>&1 | Tee-Object artifacts\\batch1-logs\\test_batch2_security.py.log
          if ($LASTEXITCODE -ne 0) { throw "Batch 2 LAB security tests failed ($LASTEXITCODE)" }

      - name: MERSAD LAB functional and security suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          python -X utf8 -u MERSAD_LAB_Preview_0.1\test_lab.py 2>&1 | Tee-Object artifacts\batch1-logs\test_lab.py.log
          if ($LASTEXITCODE -ne 0) { throw "MERSAD LAB test suite failed ($LASTEXITCODE)" }

      - name: MERSAD AI self-test (standard)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          Remove-Item Env:MERSAD_BLOCK_SKLEARN -ErrorAction SilentlyContinue
          python -X utf8 -u MERSAD_AI_Preview_0.1\selftest.py 2>&1 | Tee-Object artifacts\batch1-logs\selftest-standard.log
          if ($LASTEXITCODE -ne 0) { throw "MERSAD AI selftest (standard) failed ($LASTEXITCODE)" }

      - name: MERSAD AI self-test (without scikit-learn)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          $env:MERSAD_BLOCK_SKLEARN = "1"
          python -X utf8 -u MERSAD_AI_Preview_0.1\selftest.py 2>&1 | Tee-Object artifacts\batch1-logs\selftest-no-sklearn.log
          if ($LASTEXITCODE -ne 0) { throw "MERSAD AI selftest (without scikit-learn) failed ($LASTEXITCODE)" }

      - name: Upload Batch 1 test logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MERSAD_Batch1_Windows_Test_Logs
          path: artifacts/batch1-logs/
          if-no-files-found: warn
